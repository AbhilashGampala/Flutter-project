<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SleepTrack - Sleep Tracker (Interactive Android Simulator)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Light Theme (Default) */
      --bg: #F9F9F7;
      --surface: #FFFFFF;
      --surface-subtle: #F2F2EE;
      --border: #E5E5DE;
      --text-primary: #141A24;
      --text-secondary: #5E6773;
      --text-tertiary: #8E97A4;
      --brand: #233246;
      --brand-light: #E8ECF2;
      --dusty-blue: #58728E;
      --muted-sage: #537E70;
      --soft-amber: #C78B43;
      --muted-coral: #BF5B54;
      --nav-bg: #FFFFFF;
      --nav-border: #E5E5DE;
    }

    [data-theme="dark"] {
      --bg: #0C1017;
      --surface: #141B24;
      --surface-subtle: #1B232F;
      --border: #263140;
      --text-primary: #F1F4F8;
      --text-secondary: #9AA5B5;
      --text-tertiary: #626E80;
      --brand: #58728E;
      --brand-light: #1B232F;
      --dusty-blue: #58728E;
      --muted-sage: #537E70;
      --soft-amber: #C78B43;
      --muted-coral: #BF5B54;
      --nav-bg: #141B24;
      --nav-border: #263140;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #080B10;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-primary);
    }

    /* Outer Desktop Canvas & Phone Frame */
    .device-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .device-header-bar {
      color: #9AA5B5;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-live {
      background: rgba(83, 126, 112, 0.2);
      color: #537E70;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
    }

    .phone-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 46px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 12px #1E2530, 0 0 0 14px #2D3748;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.25s ease;
    }

    /* Android Status Bar */
    .status-bar {
      height: 42px;
      padding: 10px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      z-index: 10;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    /* Screen Content Area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 20px 24px 20px;
      position: relative;
    }

    .screen-content::-webkit-scrollbar {
      display: none;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      height: 68px;
      background: var(--nav-bg);
      border-top: 1px solid var(--nav-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 8px;
      z-index: 20;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      color: var(--brand);
      font-weight: 700;
    }

    .nav-icon {
      font-size: 18px;
    }

    /* Reusable Card */
    .somna-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Buttons */
    .somna-btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      background: var(--brand);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .somna-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .somna-btn.secondary {
      background: var(--surface-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .somna-btn.destructive {
      background: rgba(191, 91, 84, 0.12);
      color: var(--muted-coral);
      border: 1px solid var(--muted-coral);
    }

    /* Hero Duration Display */
    .hero-stat {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1.1;
      color: var(--text-primary);
    }

    /* Progress Ring Canvas */
    .ring-container {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring-text {
      position: absolute;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }

    .ring-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    /* Bar Chart */
    .chart-container {
      margin-top: 16px;
      height: 130px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      padding-top: 20px;
    }

    .chart-goal-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dashed var(--text-tertiary);
      opacity: 0.4;
      display: flex;
      justify-content: flex-end;
      padding-right: 4px;
      font-size: 9px;
      color: var(--text-tertiary);
    }

    .chart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      cursor: pointer;
    }

    .chart-bar {
      width: 22px;
      border-radius: 6px;
      background: var(--dusty-blue);
      transition: height 0.3s ease;
    }

    .chart-bar.met {
      background: var(--muted-sage);
    }

    .chart-bar.empty {
      background: var(--surface-subtle);
    }

    .chart-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Active Night Tracking Modal / Overlay */
    .night-overlay {
      position: absolute;
      inset: 0;
      background: #080B10;
      color: #F1F4F8;
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 24px 32px 24px;
    }

    .night-overlay.active {
      display: flex;
    }

    .pulse-orb {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(88, 114, 142, 0.12);
      border: 1px solid rgba(88, 114, 142, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Sheet Dialogs */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
      display: none;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px 20px;
      max-height: 85%;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Quality Buttons (1-5) */
    .quality-row {
      display: flex;
      gap: 8px;
      margin: 12px 0 20px 0;
    }

    .quality-btn {
      flex: 1;
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .quality-btn.active {
      background: rgba(88, 114, 142, 0.2);
      border-color: var(--dusty-blue);
      color: var(--dusty-blue);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-primary);
      font-size: 14px;
      margin-top: 6px;
      margin-bottom: 16px;
      outline: none;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-subtle);
      color: var(--text-secondary);
    }

    /* Tag Chips */
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      transition: all 0.2s ease;
      user-select: none;
    }

    .tag-chip.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="device-wrapper">
    <div class="device-header-bar">
      <span>SleepTrack Simulator (393 × 852 dp)</span>
      <span class="badge-live">LIVE ACTIVE RUNNER</span>
    </div>

    <!-- Phone Frame -->
    <div class="phone-frame" id="phoneFrame">
      
      <!-- Android Status Bar -->
      <div class="status-bar">
        <span id="statusBarClock">07:30</span>
        <div class="status-icons">
          <span>●●●</span>
          <span>WiFi</span>
          <span>98%</span>
        </div>
      </div>

      <!-- Main Screen Content Area -->
      <div class="screen-content" id="screenContent">
        <!-- Views dynamically injected here -->
      </div>

      <!-- Bottom Navigation Bar -->
      <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('home')">
          <div class="nav-icon">⌂</div>
          <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('history')">
          <div class="nav-icon">≡</div>
          <span>History</span>
        </div>
        <div class="nav-item" onclick="switchTab('analytics')">
          <div class="nav-icon">📊</div>
          <span>Analytics</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
          <div class="nav-icon">👤</div>
          <span>Profile</span>
        </div>
      </div>

      <!-- Nighttime Active Tracking Screen Overlay -->
      <div class="night-overlay" id="nightOverlay">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <button onclick="minimizeTracking()" style="background:none; border:none; color:#9AA5B5; font-size:16px; cursor:pointer;">✕</button>
          <span style="font-size:12px; color:#9AA5B5; font-weight:600;">ACTIVE SLEEP TRACKING</span>
          <button onclick="discardActiveSession()" style="background:none; border:none; color:#BF5B54; font-size:13px; cursor:pointer;">Discard</button>
        </div>

        <div style="text-align:center;">
          <div class="pulse-orb">
            <span style="font-size:32px;">🌙</span>
          </div>
          <div style="font-size:52px; font-weight:700; letter-spacing:-2px; margin-top:36px;" id="nightStopwatch">00:00:00</div>
          <div style="color:#9AA5B5; font-size:13px; margin-top:8px;" id="nightStartedLabel">Started at 23:15</div>
        </div>

        <div>
          <button class="somna-btn" onclick="openWakeUpModal()">Wake Up</button>
          <div style="text-align:center; color:#626E80; font-size:10px; margin-top:10px;">Calculated from stored hardware timestamp</div>
        </div>
      </div>

      <!-- Reusable Bottom Sheet Modal -->
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-sheet" id="modalSheetContent"></div>
      </div>

    </div>
  </div>

  <script>
    // --- Application State Store (Local-first & Persisted) ---
    const STORAGE_KEY = 'sleeptrack_local_data';
    
    let appState = {
      theme: 'dark',
      onboardingDone: true,
      preferences: {
        sleepGoalMinutes: 480, // 8h
        preferredBedtimeMinutes: 23 * 60, // 23:00
        preferredWakeMinutes: 7 * 60, // 07:00
        bedtimeReminder: true,
        wakeReminder: true
      },
      activeSession: null, // { startTimestamp: ISO }
      sessions: [] // Array of { id, start, end, quality, notes, source }
    };

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch(e) {}
      }
      if (!appState.sessions || appState.sessions.length === 0) {
        seedInitialData();
      }
      applyTheme(appState.theme);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function applyTheme(theme) {
      document.getElementById('phoneFrame').setAttribute('data-theme', theme);
    }

    // Seed 14 realistic sample nights
    function seedInitialData() {
      const now = new Date();
      const samples = [
        { d: 1, bh: 23, bm: 15, wh: 7, wm: 30, q: 4, notes: 'Woke up refreshed with natural light.', tags: ['Reading', 'Cool Room'] },
        { d: 2, bh: 23, bm: 45, wh: 7, wm: 15, q: 3, notes: 'Read 20 pages before turning off lights.', tags: ['Reading'] },
        { d: 3, bh: 0, bm: 10, wh: 7, wm: 45, q: 3, notes: 'Movie night with friends.', tags: ['Screen Time'] },
        { d: 4, bh: 23, bm: 0, wh: 7, wm: 20, q: 5, notes: 'Optimal circadian rhythm.', tags: ['Meditation', 'Cool Room'] },
        { d: 5, bh: 22, bm: 50, wh: 7, wm: 0, q: 4, notes: 'Evening tea wind-down.', tags: ['Reading'] },
        { d: 6, bh: 23, bm: 30, wh: 8, wm: 0, q: 4, notes: 'Weekend restful recovery.', tags: ['Meditation'] },
        { d: 7, bh: 0, bm: 30, wh: 9, wm: 0, q: 3, notes: 'Late Saturday rest.', tags: ['Late Meal', 'Screen Time'] },
        { d: 8, bh: 23, bm: 10, wh: 7, wm: 10, q: 4, notes: '', tags: ['Cool Room'] },
        { d: 9, bh: 23, bm: 5, wh: 7, wm: 25, q: 5, notes: 'Fell asleep very easily.', tags: ['Workout', 'Cool Room'] },
        { d: 10, bh: 23, bm: 40, wh: 6, wm: 50, q: 2, notes: 'Street noise outside.', tags: ['Caffeine', 'Screen Time'] },
        { d: 11, bh: 22, bm: 45, wh: 7, wm: 15, q: 4, notes: '', tags: ['Reading'] },
        { d: 12, bh: 23, bm: 20, wh: 7, wm: 30, q: 4, notes: 'Tired after gym workout.', tags: ['Workout'] },
        { d: 13, bh: 23, bm: 0, wh: 7, wm: 0, q: 4, notes: '', tags: ['Meditation'] },
        { d: 14, bh: 23, bm: 15, wh: 7, wm: 30, q: 5, notes: 'Deep continuous sleep.', tags: ['Cool Room', 'Reading'] }
      ];

      appState.sessions = samples.map((s, idx) => {
        const target = new Date(now.getTime() - s.d * 86400000);
        const wake = new Date(target.getFullYear(), target.getMonth(), target.getDate(), s.wh, s.wm);
        const bedTarget = s.bh >= 18 ? new Date(wake.getTime() - 86400000) : wake;
        const bed = new Date(bedTarget.getFullYear(), bedTarget.getMonth(), bedTarget.getDate(), s.bh, s.bm);
        return {
          id: idx + 1,
          start: bed.toISOString(),
          end: wake.toISOString(),
          quality: s.q,
          notes: s.notes,
          tags: s.tags || [],
          source: 'timer'
        };
      });
      saveState();
    }

    // --- Circular Directional Statistics (Handling Midnight Wrap-around) ---
    function computeCircularMetrics(sessions) {
      if (!sessions || sessions.length === 0) {
        return { avgDuration: 0, avgBedtime: '00:00', avgWake: '00:00', consistency: 0, metGoalPct: 0 };
      }

      let totalMinutes = 0;
      let sumSinBed = 0, sumCosBed = 0;
      let sumSinWake = 0, sumCosWake = 0;
      let metGoalCount = 0;

      sessions.forEach(s => {
        const start = new Date(s.start);
        const end = new Date(s.end);
        const dur = Math.round((end - start) / 60000);
        totalMinutes += dur;
        if (dur >= appState.preferences.sleepGoalMinutes) metGoalCount++;

        const bedMin = start.getHours() * 60 + start.getMinutes();
        const bedAngle = (bedMin / 1440) * 2 * Math.PI;
        sumSinBed += Math.sin(bedAngle);
        sumCosBed += Math.cos(bedAngle);

        const wakeMin = end.getHours() * 60 + end.getMinutes();
        const wakeAngle = (wakeMin / 1440) * 2 * Math.PI;
        sumSinWake += Math.sin(wakeAngle);
        sumCosWake += Math.cos(wakeAngle);
      });

      const n = sessions.length;
      const meanAngleBed = (Math.atan2(sumSinBed / n, sumCosBed / n) + 2 * Math.PI) % (2 * Math.PI);
      const avgBedMin = Math.round((meanAngleBed / (2 * Math.PI)) * 1440) % 1440;

      const meanAngleWake = (Math.atan2(sumSinWake / n, sumCosWake / n) + 2 * Math.PI) % (2 * Math.PI);
      const avgWakeMin = Math.round((meanAngleWake / (2 * Math.PI)) * 1440) % 1440;

      const r = Math.sqrt(Math.pow(sumSinBed / n, 2) + Math.pow(sumCosBed / n, 2));
      const consistencyScore = Math.min(100, Math.round(r * 100));

      return {
        avgDuration: Math.round(totalMinutes / n),
        avgBedtime: formatMinToTime(avgBedMin),
        avgWake: formatMinToTime(avgWakeMin),
        consistency: consistencyScore,
        metGoalPct: Math.round((metGoalCount / n) * 100)
      };
    }

    // --- Sleep Debt Computation (14-day rolling) ---
    function computeSleepDebt(sessions, goalMin) {
      const fourteenDaysAgo = new Date(Date.now() - 14 * 86400000);
      const recent = (sessions || []).filter(s => new Date(s.end) >= fourteenDaysAgo);
      let totalDebtMin = 0;
      for (const s of recent) {
        const dur = Math.round((new Date(s.end) - new Date(s.start)) / 60000);
        if (dur < goalMin) {
          totalDebtMin += (goalMin - dur);
        }
      }
      const hours = (totalDebtMin / 60).toFixed(1);
      let severity = 'none';
      let advice = 'Your sleep schedule is balanced. Maintain your regular bedtime.';
      if (totalDebtMin > 300) {
        severity = 'high';
        advice = 'Significant accumulated sleep debt. Consider adding 30-45 minutes to your bedtime this week.';
      } else if (totalDebtMin > 120) {
        severity = 'moderate';
        advice = 'Moderate debt. A 20-minute earlier bedtime will help restore your circadian baseline.';
      } else if (totalDebtMin > 60) {
        severity = 'mild';
        advice = 'Mild sleep debt detected. Rest well tonight to stay balanced.';
      }
      return { minutes: totalDebtMin, hours, severity, advice };
    }

    // --- Pre-Sleep Factors & Lifestyle Correlations ---
    function computeTagCorrelations(sessions) {
      if (!sessions || sessions.length === 0) return [];
      const tagMap = {};
      let totalDur = 0;
      for (const s of sessions) {
        const dur = Math.round((new Date(s.end) - new Date(s.start)) / 60000);
        totalDur += dur;
        const tags = s.tags || [];
        for (const t of tags) {
          if (!tagMap[t]) tagMap[t] = { count: 0, totalDur: 0, totalQual: 0 };
          tagMap[t].count++;
          tagMap[t].totalDur += dur;
          tagMap[t].totalQual += (s.quality || 3);
        }
      }
      const avgDur = totalDur / sessions.length;
      const list = [];
      for (const t in tagMap) {
        const item = tagMap[t];
        const itemAvgDur = item.totalDur / item.count;
        list.push({
          name: t,
          count: item.count,
          diffMin: Math.round(itemAvgDur - avgDur),
          avgQuality: (item.totalQual / item.count).toFixed(1)
        });
      }
      list.sort((a,b) => b.count - a.count);
      return list;
    }

    function formatMinToTime(m) {
      const h = Math.floor(m / 60).toString().padStart(2, '0');
      const min = (m % 60).toString().padStart(2, '0');
      return `${h}:${min}`;
    }

    function formatDuration(min) {
      const h = Math.floor(min / 60);
      const m = min % 60;
      if (h === 0) return `${m}m`;
      if (m === 0) return `${h}h`;
      return `${h}h ${m}m`;
    }

    // --- Tab Navigation ---
    let currentTab = 'home';
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach((el, idx) => {
        el.classList.toggle('active', ['home', 'history', 'analytics', 'profile'][idx] === tab);
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('screenContent');
      if (currentTab === 'home') renderHomeScreen(container);
      else if (currentTab === 'history') renderHistoryScreen(container);
      else if (currentTab === 'analytics') renderAnalyticsScreen(container);
      else if (currentTab === 'profile') renderProfileScreen(container);
    }

    // --- SCREEN: Home ---
    function renderHomeScreen(container) {
      const latest = appState.sessions.length > 0 ? appState.sessions[0] : null;
      const metrics = computeCircularMetrics(appState.sessions);
      const goalMin = appState.preferences.sleepGoalMinutes;

      let latestDur = latest ? Math.round((new Date(latest.end) - new Date(latest.start)) / 60000) : 0;
      let pct = latest ? Math.min(200, Math.round((latestDur / goalMin) * 100)) : 0;

      // 7 Day bars
      const now = new Date();
      let barsHtml = '';
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 86400000);
        const dayStr = d.toLocaleDateString('en-US', { weekday: 'short' });
        const s = appState.sessions.find(x => new Date(x.end).toDateString() === d.toDateString());
        const dur = s ? Math.round((new Date(s.end) - new Date(s.start)) / 60000) : 0;
        const hPct = Math.min(100, Math.max(8, Math.round((dur / (goalMin + 120)) * 100)));
        const isMet = dur >= goalMin;
        barsHtml += `
          <div class="chart-col" onclick="showSessionDetail(${s ? s.id : null})">
            <div class="chart-bar ${dur > 0 ? (isMet ? 'met' : '') : 'empty'}" style="height: ${dur > 0 ? hPct : 8}%;"></div>
            <span class="chart-label">${dayStr}</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <div>
            <div style="font-size:20px; font-weight:700;">Good morning</div>
            <div style="font-size:12px; color:var(--text-secondary);">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</div>
          </div>
          <button onclick="switchTab('profile')" style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">⚙</button>
        </div>

        ${appState.activeSession ? `
          <button class="somna-btn" onclick="openActiveTracking()" style="background:#537E70; margin-bottom:20px;">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#FFF;"></span>
            Sleep Tracking Active
          </button>
        ` : `
          <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="somna-btn" onclick="startSleepSession()">🌙 Start Sleep</button>
            <button class="somna-btn secondary" style="width:52px;" onclick="openManualEntryModal()" title="Log manually">+</button>
          </div>
        `}

        <div class="somna-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <span class="card-title">Last Recorded Sleep</span>
            <span class="badge">${latest ? new Date(latest.end).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'No data'}</span>
          </div>
          <div style="display:flex; align-items:center; gap:20px;">
            <div class="ring-container">
              <svg width="104" height="104" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="var(--surface-subtle)" stroke-width="8" />
                <circle cx="50" cy="50" r="42" fill="none" stroke="${pct >= 100 ? 'var(--muted-sage)' : 'var(--dusty-blue)'}" stroke-width="8"
                  stroke-dasharray="264" stroke-dashoffset="${264 - (264 * Math.min(100, pct)) / 100}" stroke-linecap="round" transform="rotate(-90 50 50)" />
              </svg>
              <div class="ring-text">${pct}%<div class="ring-sub">of goal</div></div>
            </div>
            <div>
              <div class="hero-stat">${latest ? formatDuration(latestDur) : '--'}</div>
              <div style="font-size:13px; font-weight:600; color:${latestDur >= goalMin ? 'var(--muted-sage)' : 'var(--soft-amber)'}; margin-top:4px;">
                ${latest ? (latestDur >= goalMin ? '+' : '-') + formatDuration(Math.abs(latestDur - goalMin)) + ' vs goal' : 'No sleep logged'}
              </div>
              <div style="font-size:11px; color:var(--text-tertiary); margin-top:4px;">
                ${latest ? `${new Date(latest.start).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${new Date(latest.end).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}` : ''}
              </div>
            </div>
          </div>
        </div>

        <div class="somna-card">
          <div style="display:flex; justify-content:space-between;">
            <span class="card-title">7-Day Overview</span>
            <span style="font-size:11px; color:var(--text-tertiary);">Goal ${goalMin/60}h</span>
          </div>
          <div class="chart-container">
            <div class="chart-goal-line" style="top:32%;">Goal</div>
            ${barsHtml}
          </div>
        </div>

        <div class="somna-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <span class="card-title">Circadian Regularity</span>
            <span style="font-size:12px; font-weight:700; color:var(--muted-sage);">${metrics.consistency}% Score</span>
          </div>
          <div style="display:flex; gap:16px;">
            <div style="flex:1;">
              <div class="card-subtitle">Avg Bedtime</div>
              <div style="font-size:18px; font-weight:700; margin-top:4px;">${metrics.avgBedtime}</div>
            </div>
            <div style="width:1px; background:var(--border);"></div>
            <div style="flex:1;">
              <div class="card-subtitle">Avg Wake</div>
              <div style="font-size:18px; font-weight:700; margin-top:4px;">${metrics.avgWake}</div>
            </div>
          </div>
        </div>
      `;
    }

    // --- SCREEN: History ---
    function renderHistoryScreen(container) {
      const items = appState.sessions.map(s => {
        const start = new Date(s.start);
        const end = new Date(s.end);
        const dur = Math.round((end - start) / 60000);
        return `
          <div class="somna-card" style="margin-bottom:10px; cursor:pointer;" onclick="showSessionDetail(${s.id})">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:600; font-size:14px;">${end.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">
                  ${start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})} - ${end.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                </div>
                ${s.notes ? `<div style="font-size:11px; color:var(--text-tertiary); margin-top:4px;">${s.notes}</div>` : ''}
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700; font-size:16px; color:var(--dusty-blue);">${formatDuration(dur)}</div>
                <span class="badge" style="margin-top:4px;">Rating ${s.quality}/5</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 style="font-size:20px;">Sleep History</h2>
          <button onclick="openManualEntryModal()" style="background:none; border:none; font-size:22px; color:var(--text-primary); cursor:pointer;">+</button>
        </div>
        <div>${items || '<div style="text-align:center; padding:40px; color:var(--text-secondary);">No sleep history.</div>'}</div>
      `;
    }

    // --- SCREEN: Analytics ---
    function renderAnalyticsScreen(container) {
      const metrics = computeCircularMetrics(appState.sessions);
      const debt = computeSleepDebt(appState.sessions, appState.preferences.sleepGoalMinutes);
      const correlations = computeTagCorrelations(appState.sessions);

      let correlationsHtml = '';
      if (correlations.length > 0) {
        correlationsHtml = correlations.map(c => {
          const isPos = c.diffMin >= 0;
          const diffStr = isPos ? `+${c.diffMin}m` : `${c.diffMin}m`;
          const diffColor = isPos ? 'var(--muted-sage)' : 'var(--soft-amber)';
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border);">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="tag-chip" style="padding:3px 8px; font-size:11px; margin:0;">${c.name}</span>
                <span style="font-size:11px; color:var(--text-tertiary);">${c.count}x</span>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <span style="font-size:12px; font-weight:700; color:${diffColor};">${diffStr}</span>
                <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">★ ${c.avgQuality}</span>
              </div>
            </div>
          `;
        }).join('');
      } else {
        correlationsHtml = `<div style="font-size:12px; color:var(--text-tertiary); padding:10px 0;">Log pre-sleep habits to view correlation insights.</div>`;
      }

      container.innerHTML = `
        <h2 style="font-size:20px; margin-bottom:16px;">Sleep Analytics</h2>
        <div class="somna-card">
          <div class="card-subtitle">Average Duration</div>
          <div class="hero-stat" style="margin-top:6px;">${formatDuration(metrics.avgDuration)}</div>
          <div style="font-size:13px; color:var(--text-secondary); margin-top:8px;">Based on ${appState.sessions.length} recorded nights</div>
        </div>

        <div class="somna-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="card-title">Sleep Debt (14-Day Rolling)</span>
            <span class="badge" style="background:${debt.minutes <= 60 ? 'rgba(83,126,112,0.2)' : 'rgba(217,164,89,0.2)'}; color:${debt.minutes <= 60 ? 'var(--muted-sage)' : 'var(--soft-amber)'};">${debt.severity.toUpperCase()}</span>
          </div>
          <div style="font-size:28px; font-weight:700; color:var(--text-primary); margin-top:6px;">${debt.minutes === 0 ? '0h 00m' : formatDuration(debt.minutes)}</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-top:6px; line-height:1.4;">${debt.advice}</div>
        </div>

        <div class="somna-card">
          <div class="card-title">Pre-Sleep Habits Impact</div>
          <div class="card-subtitle" style="margin-bottom:12px;">Correlations with sleep duration and rating</div>
          ${correlationsHtml}
        </div>

        <div class="somna-card">
          <div class="card-title" style="margin-bottom:12px;">Circadian Alignment</div>
          <div style="display:flex; gap:16px;">
            <div style="flex:1;">
              <div class="card-subtitle">Calculated Bedtime</div>
              <div style="font-size:20px; font-weight:700; margin-top:4px;">${metrics.avgBedtime}</div>
            </div>
            <div style="flex:1;">
              <div class="card-subtitle">Calculated Wake</div>
              <div style="font-size:20px; font-weight:700; margin-top:4px;">${metrics.avgWake}</div>
            </div>
          </div>
          <div style="font-size:11px; color:var(--text-tertiary); margin-top:12px;">Uses circular trigonometric mean to accurately resolve times across midnight.</div>
        </div>

        <div class="somna-card">
          <div class="card-title">Goal Adherence</div>
          <div style="font-size:32px; font-weight:700; color:var(--muted-sage); margin:8px 0;">${metrics.metGoalPct}%</div>
          <div class="card-subtitle">Nights meeting or exceeding target goal of ${formatDuration(appState.preferences.sleepGoalMinutes)}</div>
        </div>
      `;
    }

    // --- SCREEN: Profile & Settings ---
    function renderProfileScreen(container) {
      container.innerHTML = `
        <h2 style="font-size:20px; margin-bottom:16px;">Profile & Settings</h2>
        
        <div class="somna-card">
          <div style="font-weight:700; font-size:16px;">Sleep Schedule</div>
          <div style="margin-top:14px;">
            <div class="card-subtitle">Daily Sleep Goal</div>
            <div style="font-weight:600; font-size:15px; margin-top:2px;">${formatDuration(appState.preferences.sleepGoalMinutes)}</div>
          </div>
          <div style="margin-top:12px;">
            <div class="card-subtitle">Target Bedtime & Wake</div>
            <div style="font-weight:600; font-size:15px; margin-top:2px;">
              ${formatMinToTime(appState.preferences.preferredBedtimeMinutes)} - ${formatMinToTime(appState.preferences.preferredWakeMinutes)}
            </div>
          </div>
        </div>

        <div class="somna-card">
          <div style="font-weight:700; font-size:16px; margin-bottom:12px;">Theme & Appearance</div>
          <div style="display:flex; gap:10px;">
            <button class="somna-btn ${appState.theme === 'light' ? '' : 'secondary'}" onclick="setTheme('light')" style="height:42px; font-size:13px;">Light</button>
            <button class="somna-btn ${appState.theme === 'dark' ? '' : 'secondary'}" onclick="setTheme('dark')" style="height:42px; font-size:13px;">Midnight Dark</button>
          </div>
        </div>

        <div class="somna-card">
          <div style="font-weight:700; font-size:16px; margin-bottom:12px;">Data Management</div>
          <button class="somna-btn secondary" onclick="exportCsv()" style="margin-bottom:10px; height:44px; font-size:13px;">📥 Export RFC 4180 CSV</button>
          <button class="somna-btn secondary" onclick="seedInitialData(); renderCurrentTab();" style="margin-bottom:10px; height:44px; font-size:13px;">🔄 Seed 14 Days Sample Data</button>
          <button class="somna-btn destructive" onclick="clearAllData()" style="height:44px; font-size:13px;">🗑️ Delete All Sleep Data</button>
        </div>

        <div style="text-align:center; color:var(--text-tertiary); font-size:11px; margin-top:24px;">
          SleepTrack v1.0.0 • 100% Local Device Storage
        </div>
      `;
    }

    function setTheme(th) {
      appState.theme = th;
      saveState();
      applyTheme(th);
      renderCurrentTab();
    }

    function clearAllData() {
      if (confirm('Permanently delete all local sleep history?')) {
        appState.sessions = [];
        appState.activeSession = null;
        saveState();
        renderCurrentTab();
      }
    }

    function exportCsv() {
      const headers = ['Session ID', 'Start Time', 'End Time', 'Duration (Minutes)', 'Quality (1-5)', 'Notes'];
      const rows = appState.sessions.map(s => {
        const dur = Math.round((new Date(s.end) - new Date(s.start)) / 60000);
        const escapedNotes = `"${(s.notes || '').replace(/"/g, '""')}"`;
        return [s.id, s.start, s.end, dur, s.quality, escapedNotes].join(',');
      });
      const csv = [headers.join(','), ...rows].join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sleeptrack_export_${Date.now()}.csv`;
      a.click();
    }

    // --- Active Tracking Workflow ---
    let stopwatchInterval = null;
    const AVAILABLE_TAGS = ['Reading', 'Meditation', 'Workout', 'Cool Room', 'Caffeine', 'Late Meal', 'Screen Time'];
    let activeModalTags = [];

    function toggleModalTag(tag, el) {
      if (activeModalTags.includes(tag)) {
        activeModalTags = activeModalTags.filter(t => t !== tag);
        el.classList.remove('active');
      } else {
        activeModalTags.push(tag);
        el.classList.add('active');
      }
    }

    function renderTagChipsHtml(selected = []) {
      return AVAILABLE_TAGS.map(t => {
        const isAct = selected.includes(t);
        return `<span class="tag-chip ${isAct ? 'active' : ''}" onclick="toggleModalTag('${t}', this)">${t}</span>`;
      }).join('');
    }

    function startSleepSession() {
      appState.activeSession = { start: new Date().toISOString() };
      saveState();
      openActiveTracking();
    }

    function openActiveTracking() {
      if (!appState.activeSession) return;
      document.getElementById('nightOverlay').classList.add('active');
      const start = new Date(appState.activeSession.start);
      document.getElementById('nightStartedLabel').textContent = `Started at ${start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
      updateStopwatch();
      clearInterval(stopwatchInterval);
      stopwatchInterval = setInterval(updateStopwatch, 1000);
    }

    function minimizeTracking() {
      document.getElementById('nightOverlay').classList.remove('active');
      clearInterval(stopwatchInterval);
      renderCurrentTab();
    }

    function updateStopwatch() {
      if (!appState.activeSession) return;
      const elapsed = Math.floor((Date.now() - new Date(appState.activeSession.start).getTime()) / 1000);
      const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
      const m = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
      const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
      document.getElementById('nightStopwatch').textContent = `${h}:${m}:${s}`;
    }

    function discardActiveSession() {
      if (confirm('Discard this sleep session?')) {
        appState.activeSession = null;
        saveState();
        minimizeTracking();
      }
    }

    function openWakeUpModal() {
      activeModalTags = [];
      showModal(`
        <h3 style="font-size:18px; font-weight:700;">Good Morning</h3>
        <p style="font-size:13px; color:var(--text-secondary); margin-top:4px;">Finalizing your recorded sleep session.</p>
        
        <div style="margin-top:16px; font-size:13px; font-weight:600;">Perceived Sleep Quality</div>
        <div class="quality-row">
          <div class="quality-btn" onclick="selectQuality(1, this)">1</div>
          <div class="quality-btn" onclick="selectQuality(2, this)">2</div>
          <div class="quality-btn" onclick="selectQuality(3, this)">3</div>
          <div class="quality-btn active" onclick="selectQuality(4, this)">4</div>
          <div class="quality-btn" onclick="selectQuality(5, this)">5</div>
        </div>

        <div style="margin-top:14px; font-size:13px; font-weight:600;">Pre-Sleep Habits</div>
        <div class="tag-container">
          ${renderTagChipsHtml([])}
        </div>

        <label style="font-size:13px; font-weight:600;">Notes (Optional)</label>
        <textarea id="wakeNotes" rows="2" placeholder="Woke up refreshed, deep sleep..."></textarea>

        <button class="somna-btn" onclick="finalizeSleepSession()">Save Sleep Session</button>
      `);
    }

    let selectedQualityValue = 4;
    window.selectQuality = function(val, el) {
      selectedQualityValue = val;
      document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    };

    function finalizeSleepSession() {
      const notes = document.getElementById('wakeNotes').value;
      const newSession = {
        id: Date.now(),
        start: appState.activeSession.start,
        end: new Date().toISOString(),
        quality: selectedQualityValue,
        notes: notes,
        tags: [...activeModalTags],
        source: 'timer'
      };
      appState.sessions.unshift(newSession);
      appState.activeSession = null;
      saveState();
      closeModal();
      minimizeTracking();
      renderCurrentTab();
    }

    // --- Manual Entry Modal ---
    function openManualEntryModal() {
      const now = new Date();
      const yesterday = new Date(now.getTime() - 86400000);
      const defaultStart = `${yesterday.toISOString().split('T')[0]}T23:00`;
      const defaultEnd = `${now.toISOString().split('T')[0]}T07:00`;
      activeModalTags = [];

      showModal(`
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3 style="font-size:18px; font-weight:700;">Log Sleep Session</h3>
          <button onclick="closeModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-secondary);">✕</button>
        </div>
        
        <label style="font-size:12px; font-weight:600;">Bedtime (Start)</label>
        <input type="datetime-local" id="manualStart" value="${defaultStart}">

        <label style="font-size:12px; font-weight:600;">Wake-up Time (End)</label>
        <input type="datetime-local" id="manualEnd" value="${defaultEnd}">

        <div style="margin-top:6px; font-size:12px; font-weight:600;">Quality Rating</div>
        <div class="quality-row">
          <div class="quality-btn" onclick="selectQuality(1, this)">1</div>
          <div class="quality-btn" onclick="selectQuality(2, this)">2</div>
          <div class="quality-btn" onclick="selectQuality(3, this)">3</div>
          <div class="quality-btn active" onclick="selectQuality(4, this)">4</div>
          <div class="quality-btn" onclick="selectQuality(5, this)">5</div>
        </div>

        <div style="margin-top:10px; font-size:12px; font-weight:600;">Pre-Sleep Habits</div>
        <div class="tag-container">
          ${renderTagChipsHtml([])}
        </div>

        <label style="font-size:12px; font-weight:600;">Notes</label>
        <textarea id="manualNotes" rows="2" placeholder="Restful night, calm room..."></textarea>

        <button class="somna-btn" onclick="saveManualEntry()">Save Record</button>
      `);
    }

    function saveManualEntry() {
      const start = new Date(document.getElementById('manualStart').value);
      const end = new Date(document.getElementById('manualEnd').value);

      if (start >= end) {
        alert('Start time must precede wake-up time.');
        return;
      }

      // Check overlap
      const hasOverlap = appState.sessions.some(s => {
        const sStart = new Date(s.start);
        const sEnd = new Date(s.end);
        return start < sEnd && sStart < end;
      });

      if (hasOverlap) {
        alert('This entry overlaps with an existing recorded sleep session.');
        return;
      }

      const newSession = {
        id: Date.now(),
        start: start.toISOString(),
        end: end.toISOString(),
        quality: selectedQualityValue,
        notes: document.getElementById('manualNotes').value,
        tags: [...activeModalTags],
        source: 'manual'
      };

      appState.sessions.unshift(newSession);
      appState.sessions.sort((a,b) => new Date(b.start) - new Date(a.start));
      saveState();
      closeModal();
      renderCurrentTab();
    }

    function showSessionDetail(id) {
      if (!id) return;
      const s = appState.sessions.find(x => x.id === id);
      if (!s) return;
      const start = new Date(s.start);
      const end = new Date(s.end);
      const dur = Math.round((end - start) / 60000);
      const tagsHtml = s.tags && s.tags.length > 0
        ? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">${s.tags.map(t => `<span class="tag-chip active" style="font-size:11px; padding:3px 8px;">${t}</span>`).join('')}</div>`
        : '';

      showModal(`
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size:18px;">Session Details</h3>
          <button onclick="closeModal()" style="background:none; border:none; font-size:18px; cursor:pointer; color:var(--text-secondary);">✕</button>
        </div>
        <div style="font-size:32px; font-weight:700; color:var(--dusty-blue); margin:16px 0;">${formatDuration(dur)}</div>
        <div style="display:flex; flex-direction:column; gap:10px; font-size:14px; margin-bottom:20px;">
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-secondary);">Date:</span> <b>${end.toLocaleDateString()}</b></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-secondary);">Bedtime:</span> <b>${start.toLocaleTimeString()}</b></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-secondary);">Wake Up:</span> <b>${end.toLocaleTimeString()}</b></div>
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--text-secondary);">Perceived Quality:</span> <b>${s.quality}/5</b></div>
          ${tagsHtml ? `<div style="margin-top:4px;"><span style="font-size:12px; color:var(--text-secondary);">Pre-sleep Habits:</span>${tagsHtml}</div>` : ''}
          ${s.notes ? `<div style="background:var(--surface-subtle); padding:10px; border-radius:10px; margin-top:8px;">${s.notes}</div>` : ''}
        </div>
        <button class="somna-btn destructive" onclick="deleteSession(${s.id})">Delete Session</button>
      `);
    }

    function deleteSession(id) {
      if (confirm('Delete this sleep record?')) {
        appState.sessions = appState.sessions.filter(x => x.id !== id);
        saveState();
        closeModal();
        renderCurrentTab();
      }
    }

    function showModal(html) {
      document.getElementById('modalSheetContent').innerHTML = html;
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    setInterval(() => {
      const d = new Date();
      document.getElementById('statusBarClock').textContent = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }, 1000);

    loadState();
    renderCurrentTab();
  </script>
</body>
</html>
